# Builds the presskit from data.xml and the project folders on every push to
# main and deploys it to GitHub Pages, which is what chibifire.com's DNS
# points at. presskit.html 0.13.0 is the version the site was built with;
# its sharp 0.23 only installs on Node 14, so the job pins both.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "14"
      - name: Build the presskit
        run: |
          npm install -g presskit@0.13.0
          presskit build . --pretty-links
      - name: Check the build
        run: |
          test -f build/index.html
          grep -q '<title>Chibifire.com' build/index.html
          grep -q 'presskit.html 0.13.0' build/index.html
          if grep -rli weftspun build; then
            echo "the presskit mentions weftspun" >&2
            exit 1
          fi
          echo "files: $(find build -type f | wc -l)"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
