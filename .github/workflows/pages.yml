# Deploys the presskit tree kept on the gh-pages branch (the pixelnest
# presskit.html build) to GitHub Pages, which is what chibifire.com's DNS
# points at. That tree is published as it stands; nothing is rebuilt.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - name: Check the presskit tree
        run: |
          test -f site/index.html
          grep -q '<title>Chibifire.com' site/index.html
          if grep -rli weftspun site --exclude-dir=.git; then
            echo "gh-pages tree mentions weftspun" >&2
            exit 1
          fi
          echo "files: $(find site -type f -not -path 'site/.git/*' | wc -l)"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
